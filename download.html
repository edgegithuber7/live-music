<!doctype html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Live Music — Downloading</title>
  <meta name="theme-color" content="#000000">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icon.png">
  <link rel="stylesheet" href="styles.css">
  <style>
    .dl { max-width: 560px; margin: 0 auto; text-align: center; padding: 56px 0 24px; position: relative; z-index: 1; }
    .dl .icon { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 20px 80px rgba(161, 76, 255, 0.45), 0 0 0 1px var(--border); }
    .dl h1 { font-size: clamp(34px, 6vw, 52px); margin: 26px 0 10px; }
    .dl .lead { color: var(--muted); font-size: 18px; margin: 0 auto; max-width: 460px; }
    .dl .actions { margin-top: 28px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .dl .fileinfo { font-size: 13px; color: var(--faint); }
    .spinner { width: 18px; height: 18px; border-radius: 50%; border: 2px solid rgba(255, 255, 255, 0.35); border-top-color: #fff; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .steps { max-width: 560px; margin: 8px auto 0; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 24px 26px; position: relative; z-index: 1; }
    .steps h2 { font-size: 18px; text-align: left; margin: 0 0 12px; }
    .steps ol { margin: 0; padding-left: 22px; color: var(--muted); }
    .steps li { margin: 8px 0; }
    .steps li b { color: var(--text); }
    .others { text-align: center; margin: 28px 0 56px; font-size: 14px; color: var(--muted); position: relative; z-index: 1; }
    .others a { color: var(--muted); margin: 0 8px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>

  <div class="wrap">
    <nav>
      <a class="brand" href="index.html"><img src="icon.png" alt=""> Live Music</a>
      <div class="links">
        <a href="index.html#download">Download</a>
        <a href="index.html#features">Features</a>
        <a href="changelog.html">What's new</a>
      </div>
    </nav>

    <main class="dl">
      <img class="icon" src="icon.png" alt="Live Music app icon">
      <h1 id="title">Getting your download…</h1>
      <p class="lead" id="lead">Checking for the latest version.</p>
      <div class="actions">
        <a class="btn primary" id="manual" hidden>Download now</a>
        <span class="fileinfo" id="fileinfo"></span>
        <a class="btn secondary" id="glaze" hidden>Get it through Glaze instead</a>
      </div>
    </main>

    <section class="steps" id="steps" hidden>
      <h2 id="steps-title">Next steps</h2>
      <ol id="steps-list"></ol>
    </section>

    <p class="others" id="others">
      Need a different version?
      <a href="download.html?platform=mac">Mac (Apple silicon)</a>
      <a href="download.html?platform=mac-intel">Mac (Intel)</a>
      <a href="download.html?platform=windows">Windows</a>
      <a href="download.html?platform=android">Android</a>
      <a href="changelog.html">What's new</a>
    </p>
  </div>

  <script>
    const REPO = "edgegithuber7/live-music";
    const MAC_GLAZE_LINK = "https://www.glaze.app/app/live-music-JtgOee";

    const PLATFORMS = {
      mac: {
        name: "Mac (Apple silicon)",
        asset: "LiveMusic.dmg",
        steps: [
          "Open <b>LiveMusic.dmg</b> from your Downloads folder.",
          "Drag <b>Live Music</b> into the <b>Applications</b> folder.",
          "Open Live Music from Applications. The first time, macOS says it can't check the app for malicious software — click <b>Done</b>.",
          "Open <b>System Settings → Privacy &amp; Security</b>, scroll down and click <b>Open Anyway</b> next to Live Music, then confirm. You only need to do this once.",
        ],
      },
      "mac-intel": {
        name: "Intel Mac",
        asset: "LiveMusic-Intel.dmg",
        steps: [
          "Open <b>LiveMusic-Intel.dmg</b> from your Downloads folder.",
          "Drag <b>Live Music</b> into the <b>Applications</b> folder.",
          "Open Live Music from Applications. The first time, macOS says it can't check the app for malicious software — click <b>Done</b>.",
          "Open <b>System Settings → Privacy &amp; Security</b>, scroll down and click <b>Open Anyway</b> next to Live Music, then confirm. You only need to do this once.",
        ],
      },
      windows: {
        name: "Windows",
        asset: "LiveMusic-Setup.exe",
        steps: [
          "Open <b>LiveMusic-Setup.exe</b> from your Downloads folder.",
          "If Windows says <b>Windows protected your PC</b>, choose <b>More info</b>, then <b>Run anyway</b>.",
          "Follow the installer, then open Live Music from the Start menu and sign in.",
        ],
      },
      android: {
        name: "Android",
        asset: "LiveMusic.apk",
        steps: [
          "When the download finishes, tap <b>LiveMusic.apk</b> in your notifications or Downloads.",
          "If asked, allow your browser to <b>install unknown apps</b>, then go back and tap <b>Install</b>.",
          "Open Live Music and sign in. To update later, install the new version over the top. Your library stays.",
        ],
      },
    };

    const $ = (id) => document.getElementById(id);
    const param = new URLSearchParams(location.search).get("platform");
    const platform = PLATFORMS[param] ? param : null;

    function formatSize(bytes) {
      return bytes >= 1e9 ? (bytes / 1e9).toFixed(1) + " GB" : Math.round(bytes / 1e6) + " MB";
    }

    function showSteps(p) {
      $("steps-title").textContent = "Installing on " + p.name;
      $("steps-list").innerHTML = p.steps.map((s) => "<li>" + s + "</li>").join("");
      $("steps").hidden = false;
    }

    function showGlaze() {
      const g = $("glaze");
      g.href = MAC_GLAZE_LINK;
      g.hidden = false;
    }

    if (!platform) {
      $("title").textContent = "Choose your device";
      $("lead").textContent = "Pick the version of Live Music you'd like to download.";
    } else {
      const p = PLATFORMS[platform];
      document.title = "Live Music for " + p.name + " — Download";
      fetch("https://api.github.com/repos/" + REPO + "/releases/latest")
        .then((r) => (r.ok ? r.json() : null))
        .catch(() => null)
        .then((release) => {
          const asset = (release?.assets ?? []).find((a) => a.name === p.asset);
          const version = release?.tag_name?.replace(/^v/, "");

          if (!asset) {
            $("title").textContent = "Live Music for " + p.name + " is coming soon";
            $("lead").textContent =
              (platform === "mac" || platform === "mac-intel")
                ? "The direct download isn't ready yet. You can get Live Music for Mac through Glaze in the meantime."
                : "It isn't ready to download just yet. Check back soon, or see what's coming in the changelog.";
            if (platform === "mac" || platform === "mac-intel") showGlaze();
            return;
          }

          $("title").textContent = "Your download is starting";
          $("lead").textContent = "Live Music for " + p.name + (version ? " · version " + version : "") + ". If it doesn't start in a few seconds, use the button below.";
          const btn = $("manual");
          btn.href = asset.browser_download_url;
          btn.textContent = "Download for " + p.name;
          btn.hidden = false;
          $("fileinfo").textContent = p.asset + " · " + formatSize(asset.size);
          if (platform === "mac" || platform === "mac-intel") showGlaze();
          showSteps(p);

          // Start the download without leaving this page.
          setTimeout(() => { location.href = asset.browser_download_url; }, 600);
        });
    }
  </script>
</body>
</html>
